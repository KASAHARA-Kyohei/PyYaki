[package]
name = "pyyaki-host"
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.89"
publish = false

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "pyyaki"
path = "src/main.rs"

[[bin]]
name = "pyyaki-cli"
path = "src/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
percent-encoding = "2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.34"
wry = { version = "0.53", default-features = false, features = ["protocol", "os-webview"] }
getrandom = "0.3"
[target.'cfg(windows)'.dependencies]
sha2 = "0.10.9"
windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_System_IO", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
