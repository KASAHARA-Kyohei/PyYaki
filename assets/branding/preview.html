<style>

<header><h1>PyYaki · B案の仕上げ</h1><p>柔らかな焼き菓子の質感を保ち、縁と溝の焼き色を調整しました。</p></header>
<main><article><h2>元のB</h2><p>柔らかい焼き色</p><img class="hero" src="concepts/b-soft.png" width="256" height="256" alt="元のB"><div class="sizes light"><figure><img src="concepts/b-soft.png" width="64" height="64" alt="元のB 64px"><figcaption>64px</figcaption></figure><figure><img src="concepts/b-soft.png" width="32" height="32" alt="元のB 32px"><figcaption>32px</figcaption></figure><figure><img src="concepts/b-soft.png" width="16" height="16" alt="元のB 16px"><figcaption>16px</figcaption></figure></div><div class="sizes dark"><figure><img src="concepts/b-soft.png" width="64" height="64" alt="元のB 64px"><figcaption>64px</figcaption></figure><figure><img src="concepts/b-soft.png" width="32" height="32" alt="元のB 32px"><figcaption>32px</figcaption></figure><figure><img src="concepts/b-soft.png" width="16" height="16" alt="元のB 16px"><figcaption>16px</figcaption></figure></div></article><article><h2>仕上げ版B</h2><p>縁と溝の焼き色を少し濃く調整</p><img class="hero" src="pyyaki-icon.png" width="256" height="256" alt="仕上げ版B"><div class="sizes light"><figure><img src="pyyaki-icon.png" width="64" height="64" alt="仕上げ版B 64px"><figcaption>64px</figcaption></figure><figure><img src="pyyaki-icon.png" width="32" height="32" alt="仕上げ版B 32px"><figcaption>32px</figcaption></figure><figure><img src="pyyaki-icon.png" width="16" height="16" alt="仕上げ版B 16px"><figcaption>16px</figcaption></figure></div><div class="sizes dark"><figure><img src="pyyaki-icon.png" width="64" height="64" alt="仕上げ版B 64px"><figcaption>64px</figcaption></figure><figure><img src="pyyaki-icon.png" width="32" height="32" alt="仕上げ版B 32px"><figcaption>32px</figcaption></figure><figure><img src="pyyaki-icon.png" width="16" height="16" alt="仕上げ版B 16px"><figcaption>16px</figcaption></figure></div></article></main>
